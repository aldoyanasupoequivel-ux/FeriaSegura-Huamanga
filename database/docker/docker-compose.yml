services:
  postgres:
    image: postgres:16-alpine
    container_name: feriasegura_postgres
    restart: always
    environment:
      POSTGRES_DB: feriasegura_db
      POSTGRES_USER: feriasegura_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura tu .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c lock_timeout=5000
      -c idle_in_transaction_session_timeout=30000
    ports:
      - "5432:5432"
    volumes:
      # Script de inicialización que orquesta las migraciones en orden
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      # Migraciones montadas para que init-db.sh las consuma
      - ../migrations:/migrations:ro
      # Scripts de seguridad accesibles en /security
      - ../security:/security:ro
      # Tests accesibles en /tests
      - ../tests:/tests:ro
      # Volumen persistente de datos
      - postgres_data:/var/lib/postgresql/data
      # Volumen separado para WAL archive (FSH-34)
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feriasegura_user -d feriasegura_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Servicio de administración pgAdmin (solo desarrollo)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: feriasegura_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@feriasegura.gob.pe
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configura tu .env}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  wal_archive:
    driver: local
  pgadmin_data:
    driver: local
